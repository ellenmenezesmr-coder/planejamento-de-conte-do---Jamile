# planejamento-conteudos-jamile
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planejamento de Conteúdo — Jamile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0B0B0B;
    --surface:#141414;
    --surface-2:#1b1b1b;
    --surface-3:#232323;
    --pink:#F21F6B;
    --orange:#FF641F;
    --white:#FFFFFF;
    --offwhite:#F7F7F7;
    --gray:#A0A0A0;
    --gray-dim:#6b6b6b;
    --gradient: linear-gradient(135deg,#F21F6B 0%, #FF641F 100%);
    --border: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--black);color:var(--offwhite);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;position:relative;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;}
  ::selection{background:var(--pink);color:#fff;}

  /* ---------- utility ---------- */
  .grad-text{background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .btn{border:none;cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;border-radius:999px;transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--gradient);color:#fff;box-shadow:0 6px 20px -6px rgba(242,31,107,0.55);}
  .btn-primary:hover{box-shadow:0 8px 26px -6px rgba(242,31,107,0.75);}
  .btn-ghost{background:transparent;color:var(--offwhite);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--gray);}
  .btn-outline-orange{background:transparent;color:var(--orange);border:1.5px solid rgba(255,100,31,0.5);}
  .btn-outline-orange:hover{background:rgba(255,100,31,0.08);}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;}

  /* ---------- role gate ---------- */
  .gate{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%, rgba(242,31,107,0.15), transparent 55%), radial-gradient(circle at 80% 80%, rgba(255,100,31,0.14), transparent 55%), var(--black);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;}
  .gate-card{max-width:440px;width:100%;text-align:center;}
  .gate-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gray);text-transform:uppercase;font-weight:700;margin-bottom:14px;}
  .gate-title{font-size:52px;line-height:0.95;margin:0 0 6px;}
  .gate-sub{color:var(--gray);font-size:14px;margin-bottom:34px;}
  .gate-options{display:flex;flex-direction:column;gap:12px;}
  .gate-option{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:18px 20px;text-align:left;cursor:pointer;transition:all .18s ease;}
  .gate-option:hover{border-color:var(--pink);transform:translateY(-2px);}
  .gate-option h3{margin:0 0 4px;font-size:17px;}
  .gate-option p{margin:0;font-size:12.5px;color:var(--gray);}
  .admin-pass{margin-top:14px;display:none;gap:8px;}
  .admin-pass input{flex:1;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;color:#fff;font-family:'Manrope';font-size:14px;}
  .admin-pass input:focus{outline:none;border-color:var(--orange);}

  /* ---------- header ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,11,11,0.85);backdrop-filter:blur(10px);z-index:50;}
  .brand-mini{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--gray);}
  .role-badge{font-size:11px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);}
  .switch-role{background:none;border:none;color:var(--gray-dim);font-size:11px;cursor:pointer;text-decoration:underline;margin-left:10px;}

  header.hero{padding:52px 24px 30px;text-align:center;position:relative;overflow:hidden;}
  header.hero::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(ellipse at center, rgba(242,31,107,0.18), transparent 65%);pointer-events:none;}
  .tag-eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:7px 16px;border-radius:999px;border:1px solid rgba(242,31,107,0.4);color:var(--pink);margin-bottom:20px;}
  .hero-title{font-size:15px;letter-spacing:.3em;color:var(--gray);text-transform:uppercase;font-weight:700;margin-bottom:2px;}
  .hero-name{font-size:min(20vw,110px);line-height:0.86;margin:2px 0;}
  .hero-role{font-size:16px;color:var(--gray);font-weight:600;margin-bottom:18px;letter-spacing:.02em;}
  .hero-copy{max-width:520px;margin:0 auto;color:#d8d8d8;font-size:14.5px;line-height:1.6;}
  .hero-count{margin-top:26px;font-size:13px;color:var(--gray);}
  .hero-count b{color:#fff;font-size:15px;}

  /* ---------- status cards ---------- */
  .status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 20px;max-width:1100px;margin:0 auto;}
  @media(max-width:720px){.status-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 16px;transition:transform .3s ease;}
  .stat-card .num{font-size:38px;line-height:1;}
  .stat-card .label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-weight:700;margin-top:6px;}
  .stat-card.total .num{color:#fff;}
  .stat-card.approved .num{color:var(--pink);}
  .stat-card.pending .num{color:var(--gray);}
  .stat-card.comments .num{color:var(--orange);}

  /* ---------- progress ---------- */
  .progress-wrap{max-width:1100px;margin:28px auto 0;padding:0 20px;}
  .progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .progress-head .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);font-weight:800;}
  .progress-head .val{font-size:13px;color:#fff;font-weight:700;}
  .progress-track{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:var(--gradient);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);}

  /* ---------- filters ---------- */
  .controls{max-width:1100px;margin:30px auto 0;padding:0 20px;}
  .search-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 16px;color:#fff;font-family:'Manrope';font-size:14px;margin-bottom:14px;}
  .search-input:focus{outline:none;border-color:var(--pink);}
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--gray);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
  .filter-chip.active{background:var(--gradient);color:#fff;border-color:transparent;}

  /* ---------- grid ---------- */
  .content-grid{max-width:1100px;margin:26px auto 0;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .card{position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:22px;overflow:hidden;animation:cardIn .45s ease both;transition:border-color .2s ease, transform .2s ease;}
  .card:hover{transform:translateY(-3px);}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .card.approved{border-color:rgba(242,31,107,0.55);box-shadow:0 0 0 1px rgba(242,31,107,0.15) inset;}
  .card.changes{border-color:rgba(255,100,31,0.55);box-shadow:0 0 0 1px rgba(255,100,31,0.15) inset;}
  .card-num{position:absolute;top:-14px;right:6px;font-size:110px;font-family:'Bebas Neue';color:rgba(255,255,255,0.035);line-height:1;pointer-events:none;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;position:relative;z-index:1;}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag-cat{background:var(--surface-3);color:var(--offwhite);}
  .tag-fmt{border:1px solid var(--border);color:var(--gray);}
  .card-idx{font-family:'Bebas Neue';font-size:22px;color:var(--gray-dim);}
  .card-hook{font-size:17px;font-weight:700;line-height:1.35;margin:2px 0 10px;position:relative;z-index:1;color:#fff;}
  .card-complement{font-size:12.5px;color:var(--gray);margin-bottom:8px;position:relative;z-index:1;}
  .card-cta{font-size:13px;color:var(--offwhite);background:var(--surface-2);border-left:3px solid var(--orange);padding:9px 12px;border-radius:8px;margin-bottom:10px;position:relative;z-index:1;}
  .card-objective{font-size:12px;color:var(--gray-dim);line-height:1.5;margin-bottom:16px;position:relative;z-index:1;}
  .card-objective b{color:var(--gray);}
  .status-line{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:relative;z-index:1;}
  .status-badge{font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;}
  .status-badge.pending{background:rgba(160,160,160,0.12);color:var(--gray);}
  .status-badge.approved{background:rgba(242,31,107,0.15);color:var(--pink);}
  .status-badge.changes{background:rgba(255,100,31,0.15);color:var(--orange);}
  .comment-flag{font-size:11.5px;color:var(--orange);font-weight:700;}
  .card-actions{display:flex;gap:8px;position:relative;z-index:1;}
  .card-actions .btn{flex:1;padding:12px 10px;font-size:12.5px;}
  .feedback-box{margin-top:14px;padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:12.5px;position:relative;z-index:1;}
  .feedback-box .who{font-weight:800;color:var(--pink);margin-bottom:4px;}
  .feedback-box .when{color:var(--gray-dim);font-size:10.5px;margin-top:6px;}
  .meta-line{font-size:10.5px;color:var(--gray-dim);margin-top:8px;position:relative;z-index:1;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;max-width:440px;width:100%;animation:modalIn .25s cubic-bezier(.4,0,.2,1);}
  @keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal-box h3{margin:0 0 6px;font-size:19px;}
  .modal-box .sub{font-size:12.5px;color:var(--gray);margin-bottom:16px;}
  .modal-box textarea{width:100%;min-height:120px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:12px;color:#fff;font-family:'Manrope';font-size:14px;resize:vertical;}
  .modal-box textarea:focus{outline:none;border-color:var(--orange);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;padding:13px;font-size:13px;}

  /* ---------- admin sections ---------- */
  .section-title{max-width:1100px;margin:50px auto 16px;padding:0 20px;display:flex;align-items:center;gap:10px;}
  .section-title .display{font-size:26px;}
  .section-title .line{flex:1;height:1px;background:var(--border);}
  .track-grid{max-width:1100px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:820px){.track-grid{grid-template-columns:1fr;}}
  .track-col h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:0 0 10px;}
  .track-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13px;}
  .track-item .t-num{font-weight:800;color:#fff;}
  .track-item .t-status{font-size:11px;margin-top:3px;}
  .track-item .t-status.ok{color:var(--pink);}
  .track-item .t-status.warn{color:var(--orange);}
  .track-item .t-comment{font-size:12px;color:var(--gray);margin-top:6px;font-style:italic;}
  .track-item .t-when{font-size:10px;color:var(--gray-dim);margin-top:4px;}
  .track-empty{font-size:12px;color:var(--gray-dim);padding:8px 2px;}

  .timeline{max-width:700px;margin:0 auto;padding:0 20px 70px;}
  .tl-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
  .tl-dot{width:9px;height:9px;border-radius:50%;background:var(--gradient);margin-top:5px;flex-shrink:0;}
  .tl-item .tl-time{font-size:10.5px;color:var(--gray-dim);font-weight:700;letter-spacing:.05em;}
  .tl-item .tl-text{font-size:13.5px;color:var(--offwhite);margin-top:3px;}
  .tl-empty{color:var(--gray-dim);font-size:13px;padding:20px 0;text-align:center;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--border);padding:13px 22px;border-radius:999px;font-size:13px;font-weight:700;z-index:400;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--gradient);}

  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--gray);font-size:13px;}
  .footer-note{max-width:1100px;margin:0 auto;padding:0 20px 40px;text-align:center;font-size:11px;color:var(--gray-dim);}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando planejamento…</div></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>O que você gostaria de alterar?</h3>
    <div class="sub" id="modalContentLabel">Conteúdo</div>
    <textarea id="modalTextarea" placeholder="Digite aqui sua sugestão, comentário ou alteração…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSubmit">Enviar comentário</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script>
/* ================= DATA ================= */
const CONTENTS = [
  {id:1, category:"CONVERSÃO", format:"ESTÁTICO", hook:"O treino que mudou meu corpo", cta:"O treino certo muda tudo. E é isso que eu ofereço para as minhas alunas.", complement:null, objective:"Apresentar transformação através da experiência pessoal e conectar resultado com a importância de ter um treino estruturado."},
  {id:2, category:"EDUCAÇÃO", format:"CARROSSEL", hook:"Você sente que seu treino rende menos em alguns dias do mês? A culpa pode ser do seu ciclo menstrual.", cta:null, complement:null, objective:"Educar sobre possíveis variações de desempenho ao longo do ciclo menstrual e gerar identificação."},
  {id:3, category:"EDUCAÇÃO", format:"CARROSSEL", hook:"Por que a musculação é essencial para quem usa Mounjaro?", cta:null, complement:null, objective:"Explicar a importância do treinamento de força durante processos de emagrecimento e reforçar a autoridade profissional da Jamile."},
  {id:4, category:"EDUCAÇÃO", format:"ESTÁTICO", hook:"Pouco tempo pra fazer cardio? Eu posso te ajudar com isso!", cta:null, complement:"Indicar HIIT.", objective:"Mostrar uma solução prática para mulheres que têm pouco tempo e querem incluir cardio na rotina."},
  {id:5, category:"EDUCAÇÃO", format:"CARROSSEL", hook:"Inchaço vs gordura: como diferenciar para não se frustrar à toa", cta:null, complement:null, objective:"Reduzir a ansiedade em relação às mudanças no corpo e explicar que nem toda alteração visual significa ganho de gordura."},
  {id:6, category:"EDUCAÇÃO", format:"ESTÁTICO", hook:"Por que você treina há meses e não vê resultado?", cta:null, complement:null, objective:"Explorar erros comuns que podem impedir resultados e mostrar a importância de uma estratégia individualizada."},
  {id:7, category:"EDUCAÇÃO", format:"ESTÁTICO", hook:"Se o seu objetivo é crescer glúteo, fazer 5 exercícios aleatórios não é uma boa estratégia.", cta:null, complement:null, objective:"Quebrar a ideia de que quantidade de exercícios significa qualidade do treino e reforçar planejamento e progressão."},
  {id:8, category:"CONEXÃO", format:"CARROSSEL", hook:"O corpo da sua amiga não é régua para medir o seu resultado.", cta:null, complement:"Falar sobre comparação corporal.", objective:"Gerar identificação e abordar comparação corporal de maneira acolhedora."},
  {id:9, category:"CONEXÃO", format:"ESTÁTICO", hook:"O que eu faria se estivesse começando a treinar hoje", cta:null, complement:null, objective:"Compartilhar uma visão prática e pessoal para gerar proximidade e demonstrar experiência."},
  {id:10, category:"EDUCAÇÃO", format:"CARROSSEL", hook:"Duas mulheres podem ter o mesmo objetivo e precisar de treinos completamente diferentes.", cta:null, complement:null, objective:"Mostrar a importância da individualização do treino."},
  {id:11, category:"CONEXÃO", format:"ESTÁTICO", hook:"Não é sobre mudar o corpo em 30 dias.", cta:null, complement:"É sobre descobrir o que acontece quando você finalmente tem um plano que consegue seguir.", objective:"Trabalhar expectativa, consistência e construção de resultados no longo prazo."},
  {id:12, category:"EDUCAÇÃO", format:"CARROSSEL", hook:"Treinar pesado ou treinar bem?", cta:null, complement:"Falar sobre fase excêntrica e concêntrica.", objective:"Mostrar que qualidade de execução e controle do movimento são fundamentais."},
  {id:13, category:"EDUCAÇÃO", format:"CARROSSEL", hook:"Aumentar a carga ou aumentar as repetições? O que fazer?", cta:null, complement:null, objective:"Explicar de maneira simples como pensar em progressão de treino."},
  {id:14, category:"CONEXÃO", format:"ESTÁTICO", hook:"O problema não é faltar um treino. É transformar um treino perdido em uma semana perdida.", cta:null, complement:null, objective:"Combater o pensamento de tudo ou nada e incentivar consistência."}
];
const STORAGE_KEY = "jamile-plan-v1";
const ADMIN_PASS = "jamile2026";

let state = null;
let role = null; // 'client' | 'admin'
let filter = "all";
let search = "";
let activeModalId = null;

/* ================= STATE ================= */
function initState(){
  const contents = {};
  CONTENTS.forEach(c => contents[c.id] = {status:"pending", comment:null, approvedAt:null, commentAt:null});
  return {contents, history:[]};
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    state = JSON.parse(res.value);
  }catch(e){
    state = initState();
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), true); }catch(err){ console.error(err); }
  }
  render();
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
  }catch(e){ console.error("Falha ao salvar:", e); showToast("Erro ao salvar. Verifique a conexão."); }
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const date = d.toLocaleDateString('pt-BR');
  const time = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return {date, time};
}

function fmtHistoryTime(iso){
  const d = new Date(iso);
  const day = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','').toUpperCase();
  const time = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return `${day} • ${time}`;
}

/* ================= ACTIONS ================= */
async function approveContent(id){
  const c = state.contents[id];
  const now = new Date().toISOString();
  c.status = "approved";
  c.approvedAt = now;
  state.history.unshift({ts:now, text:`Jamile aprovou o Conteúdo ${String(id).padStart(2,'0')}.`});
  await saveState();
  showToast("Conteúdo aprovado ✓");
  render();
}

async function submitChangeRequest(id, text){
  if(!text || !text.trim()) return;
  const c = state.contents[id];
  const now = new Date().toISOString();
  c.status = "changes";
  c.comment = text.trim();
  c.commentAt = now;
  state.history.unshift({ts:now, text:`Jamile solicitou alteração no Conteúdo ${String(id).padStart(2,'0')}.`});
  await saveState();
  closeModal();
  showToast("Comentário enviado 💬");
  render();
}

/* ================= TOAST ================= */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ================= MODAL ================= */
function openModal(id){
  activeModalId = id;
  const c = CONTENTS.find(x=>x.id===id);
  document.getElementById('modalContentLabel').textContent = `Conteúdo ${String(id).padStart(2,'0')} — ${c.hook}`;
  document.getElementById('modalTextarea').value = "";
  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(()=>document.getElementById('modalTextarea').focus(),50);
}
function closeModal(){
  activeModalId = null;
  document.getElementById('modalOverlay').style.display = 'none';
}
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
document.getElementById('modalSubmit').addEventListener('click', ()=>{
  const val = document.getElementById('modalTextarea').value;
  if(activeModalId) submitChangeRequest(activeModalId, val);
});

/* ================= DERIVED ================= */
function counts(){
  const vals = Object.values(state.contents);
  return {
    total: CONTENTS.length,
    approved: vals.filter(v=>v.status==='approved').length,
    pending: vals.filter(v=>v.status==='pending').length,
    comments: vals.filter(v=>v.status==='changes').length
  };
}

function filteredContents(){
  return CONTENTS.filter(c=>{
    const st = state.contents[c.id].status;
    if(filter==='pending' && st!=='pending') return false;
    if(filter==='approved' && st!=='approved') return false;
    if(filter==='comments' && st!=='changes') return false;
    if(filter==='carrossel' && c.format!=='CARROSSEL') return false;
    if(filter==='estatico' && c.format!=='ESTÁTICO') return false;
    if(search && !c.hook.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
}

/* ================= RENDER PIECES ================= */
function statusBadge(st){
  if(st==='approved') return `<span class="status-badge approved">✓ Aprovado</span>`;
  if(st==='changes') return `<span class="status-badge changes">! Alteração solicitada</span>`;
  return `<span class="status-badge pending">○ Pendente</span>`;
}

function renderCard(c){
  const s = state.contents[c.id];
  const cardClass = s.status==='approved' ? 'approved' : s.status==='changes' ? 'changes' : '';
  const numStr = String(c.id).padStart(2,'0');

  let actions = '';
  if(role==='client'){
    if(s.status==='pending' || s.status==='changes'){
      actions = `<div class="card-actions">
        <button class="btn btn-primary" data-action="approve" data-id="${c.id}">Aprovar</button>
        <button class="btn btn-outline-orange" data-action="request" data-id="${c.id}">Solicitar alteração</button>
      </div>`;
    }
  }

  let feedback = '';
  if(s.comment){
    const {date,time} = fmtDateTime(s.commentAt);
    feedback = `<div class="feedback-box">
      <div class="who">💬 Jamile</div>
      <div>${escapeHtml(s.comment)}</div>
      <div class="when">${date} às ${time}</div>
    </div>`;
  }

  let meta = '';
  if(s.status==='approved'){
    const {date,time} = fmtDateTime(s.approvedAt);
    meta = `<div class="meta-line">Aprovado em ${date} • ${time}</div>`;
  }

  return `<div class="card ${cardClass}">
    <div class="card-num">${numStr}</div>
    <div class="card-top">
      <div class="card-tags">
        <span class="pill tag-cat">${c.category}</span>
        <span class="pill tag-fmt">${c.format}</span>
      </div>
      <div class="card-idx">${numStr}</div>
    </div>
    <div class="card-hook">${escapeHtml(c.hook)}</div>
    ${c.complement ? `<div class="card-complement">${escapeHtml(c.complement)}</div>` : ''}
    ${c.cta ? `<div class="card-cta">${escapeHtml(c.cta)}</div>` : ''}
    <div class="card-objective"><b>Objetivo:</b> ${escapeHtml(c.objective)}</div>
    <div class="status-line">${statusBadge(s.status)} ${s.status==='changes' ? '<span class="comment-flag">💬 Comentário da cliente</span>' : ''}</div>
    ${actions}
    ${feedback}
    ${meta}
  </div>`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderFilters(){
  const items = [
    {k:'all', l:'Todos'}, {k:'pending', l:'Pendentes'}, {k:'approved', l:'Aprovados'},
    {k:'comments', l:'Com comentários'}, {k:'carrossel', l:'Carrossel'}, {k:'estatico', l:'Estático'}
  ];
  return items.map(i=>`<button class="filter-chip ${filter===i.k?'active':''}" data-filter="${i.k}">${i.l}</button>`).join('');
}

function renderTrackColumn(title, items, kind){
  if(items.length===0) return `<div class="track-col"><h4>${title}</h4><div class="track-empty">Nenhum item aqui ainda.</div></div>`;
  const html = items.map(({c,s})=>{
    const numStr = String(c.id).padStart(2,'0');
    if(kind==='approved'){
      const {date,time} = fmtDateTime(s.approvedAt);
      return `<div class="track-item"><div class="t-num">Conteúdo ${numStr}</div><div class="t-status ok">✓ Aprovado</div><div class="t-when">${date} • ${time}</div></div>`;
    }
    if(kind==='changes'){
      const {date,time} = fmtDateTime(s.commentAt);
      return `<div class="track-item"><div class="t-num">Conteúdo ${numStr}</div><div class="t-status warn">⚠ Alteração solicitada</div><div class="t-comment">"${escapeHtml(s.comment)}"</div><div class="t-when">${date} • ${time}</div></div>`;
    }
    return `<div class="track-item"><div class="t-num">Conteúdo ${numStr}</div><div class="t-status" style="color:var(--gray);">○ Pendente</div></div>`;
  }).join('');
  return `<div class="track-col"><h4>${title}</h4>${html}</div>`;
}

function renderAdminExtras(){
  const approved = CONTENTS.filter(c=>state.contents[c.id].status==='approved').map(c=>({c,s:state.contents[c.id]}));
  const changes = CONTENTS.filter(c=>state.contents[c.id].status==='changes').map(c=>({c,s:state.contents[c.id]}));
  const pending = CONTENTS.filter(c=>state.contents[c.id].status==='pending').map(c=>({c,s:state.contents[c.id]}));

  const historyHtml = state.history.length===0
    ? `<div class="tl-empty">Nenhuma atividade registrada ainda. As ações da cliente aparecerão aqui.</div>`
    : state.history.map(h=>`<div class="tl-item"><div class="tl-dot"></div><div><div class="tl-time">${fmtHistoryTime(h.ts)}</div><div class="tl-text">${escapeHtml(h.text)}</div></div></div>`).join('');

  return `
    <div class="section-title"><span class="display">ACOMPANHAMENTO</span><div class="line"></div></div>
    <div class="track-grid">
      ${renderTrackColumn('Aprovados', approved, 'approved')}
      ${renderTrackColumn('Alterações solicitadas', changes, 'changes')}
      ${renderTrackColumn('Pendentes', pending, 'pending')}
    </div>
    <div class="section-title"><span class="display">HISTÓRICO DE ATIVIDADES</span><div class="line"></div></div>
    <div class="timeline">${historyHtml}</div>
  `;
}

/* ================= MAIN RENDER ================= */
function render(){
  if(!role){
    renderGate();
    return;
  }
  const cnt = counts();
  const pct = Math.round((cnt.approved/cnt.total)*100);
  const list = filteredContents();

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <span class="brand-mini">JAMILE · CONTEÚDO</span>
      <div>
        <span class="role-badge">${role==='admin' ? '🔐 SOCIAL MEDIA' : '👤 CLIENTE'}</span>
        <button class="switch-role" id="switchRole">trocar</button>
      </div>
    </div>

    <header class="hero">
      <div class="tag-eyebrow">PLANEJAMENTO • APROVAÇÃO</div>
      <div class="hero-title">PLANEJAMENTO DE CONTEÚDO</div>
      <h1 class="display hero-name grad-text">JAMILE</h1>
      <div class="hero-role">Personal Trainer</div>
      <p class="hero-copy">Conteúdos estratégicos para fortalecer autoridade, gerar conexão e transformar seguidores em futuras alunas.</p>
      <div class="hero-count"><b>${cnt.total}</b> conteúdos</div>
    </header>

    <div class="status-grid">
      <div class="stat-card total"><div class="num display">${cnt.total}</div><div class="label">Total</div></div>
      <div class="stat-card approved"><div class="num display">${cnt.approved}</div><div class="label">Aprovados</div></div>
      <div class="stat-card pending"><div class="num display">${cnt.pending}</div><div class="label">Pendentes</div></div>
      <div class="stat-card comments"><div class="num display">${cnt.comments}</div><div class="label">Com comentários</div></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-head">
        <span class="lbl">Progresso da aprovação</span>
        <span class="val">${cnt.approved} de ${cnt.total} aprovados · ${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    </div>

    <div class="controls">
      <input class="search-input" id="searchInput" placeholder="Buscar conteúdo…" value="${escapeHtml(search)}" />
      <div class="filter-row">${renderFilters()}</div>
    </div>

    <div class="content-grid">${list.map(renderCard).join('') || `<div class="track-empty" style="grid-column:1/-1;text-align:center;padding:40px 0;">Nenhum conteúdo encontrado.</div>`}</div>

    ${role==='admin' ? renderAdminExtras() : ''}

    <div class="footer-note">Central de aprovação de conteúdo — Jamile Personal Trainer</div>
  `;

  attachListeners();
}

function renderGate(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="gate">
      <div class="gate-card">
        <div class="gate-eyebrow">Planejamento • Aprovação</div>
        <h1 class="display gate-title grad-text">JAMILE</h1>
        <p class="gate-sub">Central de aprovação de conteúdo</p>
        <div class="gate-options">
          <div class="gate-option" id="pickClient">
            <h3>Sou a cliente</h3>
            <p>Visualizar, aprovar e comentar os conteúdos planejados.</p>
          </div>
          <div class="gate-option" id="pickAdmin">
            <h3>Sou a social media</h3>
            <p>Acompanhar aprovações, comentários e histórico completo.</p>
            <div class="admin-pass" id="adminPassRow">
              <input type="password" id="adminPassInput" placeholder="Senha de acesso" />
              <button class="btn btn-primary" id="adminPassSubmit" style="padding:0 18px;">Entrar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('pickClient').addEventListener('click', ()=>{ role='client'; render(); });
  document.getElementById('pickAdmin').addEventListener('click', ()=>{
    document.getElementById('adminPassRow').style.display = 'flex';
    document.getElementById('adminPassInput').focus();
  });
  document.getElementById('adminPassSubmit').addEventListener('click', tryAdmin);
  document.getElementById('adminPassInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryAdmin(); });
  function tryAdmin(){
    const val = document.getElementById('adminPassInput').value;
    if(val === ADMIN_PASS){ role='admin'; render(); }
    else showToast('Senha incorreta.');
  }
}

function attachListeners(){
  document.getElementById('switchRole').addEventListener('click', ()=>{ role=null; render(); });
  document.getElementById('searchInput').addEventListener('input', (e)=>{ search = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').selectionStart = document.getElementById('searchInput').value.length; });
  document.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ filter = btn.dataset.filter; render(); });
  });
  document.querySelectorAll('[data-action="approve"]').forEach(btn=>{
    btn.addEventListener('click', ()=> approveContent(parseInt(btn.dataset.id)));
  });
  document.querySelectorAll('[data-action="request"]').forEach(btn=>{
    btn.addEventListener('click', ()=> openModal(parseInt(btn.dataset.id)));
  });
}

loadState();
</script>
</body>
</html>
